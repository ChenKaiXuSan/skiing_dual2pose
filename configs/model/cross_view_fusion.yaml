# CanonFuse3D cross-view fusion model.
#
# This group is the single source of truth for the model's hyperparameters:
# CrossViewFusionTrainer reads every value below from `config.model`. Select
# this group with `model=cross_view_fusion` (the default) and override any
# single value from the command line, e.g.
#   python dual2pose/train_unity.py model.optim.lr=5e-4
backbone: crossview_fusion

arch:
  hidden_dim: 128
  num_heads: 4
  dropout: 0.1
  temporal_kernel_size: 5
  # Body-frame canonicalization of the two input streams and of the target.
  #   per_frame   every frame is centred at its own pelvis and rotated into its
  #               own hip/neck body frame (per-frame person centering).
  #   first_frame legacy protocol of the IVC manuscript: one reference frame,
  #               the first frame of the batch, shared by all its sequences.
  # Checkpoints saved before this key existed are loaded as first_frame; the
  # trainer adopts the mode recorded in a checkpoint when it loads one.
  canonical_mode: per_frame

optim:
  lr: 0.001
  weight_decay: 0.01

loss:
  lambda_view_recon: 0.05
  lambda_alpha_balance: 0.02
  lambda_alpha_entropy: 0.005
  lambda_temporal_smooth: 0.01
