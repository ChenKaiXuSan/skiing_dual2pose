name: Distribution and source export
on:
  push:
    branches: [master, per-frame-canonicalization, 'codex/**']
  pull_request:
jobs:
  distribution:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/canonfuse-install
      - run: /tmp/canonfuse-install/bin/pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Load installed configuration outside checkout
        working-directory: /tmp
        run: /tmp/canonfuse-install/bin/python -c "from dual2pose.config import load_config; c=load_config(); assert c.model.arch.hidden_dim == 128"
      - run: python tools/export_source.py --output /tmp/canonfuse3d-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-distributions
          path: |
            dist/
            /tmp/canonfuse3d-source.tar.gz
